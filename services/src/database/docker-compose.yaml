services:
  postgres:
    image: postgres:18.7
    container_name: db_octsoc
    restart: always
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
    ports:
      - "5555:5432"
    volumes:
      - ./data:/var/lib/postgresql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
