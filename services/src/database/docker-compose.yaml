services:
  postgres:
    image: postgres:18.7
    container_name: db_octsoc
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
    ports:
      - "5555:5432"
    volumes:
      - ./data:/var/lib/postgresql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer:6.3.0
    container_name: adminer_octsoc
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8090:8080"
    depends_on:
      - postgres
