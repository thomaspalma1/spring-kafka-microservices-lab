spring:
  application:
    name: orders
  datasource:
    url: jdbc:postgresql://localhost:5555/octsocorders
    username: ${POSTGRES_USER:example}
    password: ${POSTGRES_PASSWORD:example}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

springdoc:
  open-api:
    info:
      title: Octsoc Orders API
      description: Order placement, bank payment and order status for the web and mobile channels.
      version: '1.0'
