spring:
  application:
    name: products
  datasource:
    url: jdbc:postgresql://localhost:5555/octsocproducts
    username: ${POSTGRES_USER:example}
    password: ${POSTGRES_PASSWORD:example}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
